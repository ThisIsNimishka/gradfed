name: GradFed CI & Setup Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: Lint, Import & Diagnostics Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode & Syntax Validation
        run: |
          python -m compileall src/ baseline/ scripts/

      - name: Execute Setup Verification Diagnostics
        run: |
          python scripts/setup_verification.py

      - name: Validate Fast CPU Smoke-Test (2 Rounds)
        run: |
          python src/gradfed_main.py \
            --dataset cifar10 \
            --model resnet10 \
            --num_users 5 \
            --frac 0.4 \
            --epochs 2 \
            --local_ep 1 \
            --local_bs 10 \
            --gpu -1

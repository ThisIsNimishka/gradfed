<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="chart-bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="loss-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .tick-label { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
    .tick-label-y { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; text-anchor: end; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" rx="14" fill="url(#chart-bg3)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="42" class="title">Global Evaluation Loss vs. Communication Rounds (CIFAR-10)</text>
  <text x="50" y="62" class="subtitle">Cross-Entropy Loss Dynamics on Non-IID Dirichlet Data (Lower is Better)</text>

  <!-- Chart Dimensions: X: 80 to 840 (width 760), Y: 400 to 100 (height 300) -->
  <!-- X: Round 0 to 30 => x = 80 + round * 25.33 -->
  <!-- Y: Loss 0.0 to 2.5 => y = 400 - loss * (300 / 2.5) = 400 - loss * 120 -->

  <!-- Horizontal Grid lines: 0.0, 0.5, 1.0, 1.5, 2.0, 2.5 -->
  <g stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8">
    <line x1="80" y1="400" x2="840" y2="400" stroke="#475569" stroke-width="1.2" stroke-dasharray="none" />
    <line x1="80" y1="340" x2="840" y2="340" />
    <line x1="80" y1="280" x2="840" y2="280" />
    <line x1="80" y1="220" x2="840" y2="220" />
    <line x1="80" y1="160" x2="840" y2="160" />
    <line x1="80" y1="100" x2="840" y2="100" />
  </g>

  <!-- Y Ticks -->
  <text x="70" y="404" class="tick-label-y">0.0</text>
  <text x="70" y="344" class="tick-label-y">0.5</text>
  <text x="70" y="284" class="tick-label-y">1.0</text>
  <text x="70" y="224" class="tick-label-y">1.5</text>
  <text x="70" y="164" class="tick-label-y">2.0</text>
  <text x="70" y="104" class="tick-label-y">2.5</text>

  <!-- X Ticks -->
  <g class="tick-label">
    <text x="80" y="425">0</text>
    <text x="207" y="425">5</text>
    <text x="333" y="425">10</text>
    <text x="460" y="425">15</text>
    <text x="587" y="425">20</text>
    <text x="713" y="425">25</text>
    <text x="840" y="425">30</text>
  </g>

  <text x="460" y="455" class="axis-label" text-anchor="middle">Communication Rounds (t)</text>
  <text x="28" y="250" class="axis-label" transform="rotate(-90 28 250)" text-anchor="middle">Evaluation Loss</text>

  <!-- FedAvg Loss (Red dashed) -->
  <path d="M 80 115 Q 207 200, 333 240 T 587 265 T 840 275" fill="none" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="5,4" />

  <!-- FedProx Loss (Amber dashed) -->
  <path d="M 80 115 Q 207 215, 333 250 T 587 275 T 840 285" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="5,4" />

  <!-- FedPPO Loss (Emerald line) -->
  <path d="M 80 115 L 105 138 L 156 220 L 207 245 L 333 275 L 460 295 L 587 305 L 840 315" fill="none" stroke="#10b981" stroke-width="2.5" />

  <!-- GradFed Loss (Purple Line with Shaded Area) -->
  <!-- Actual data points:
       R1: 2.1801 -> y = 400 - 2.1801*120 = 138.4 (x=105)
       R2: 1.7474 -> y = 190.3 (x=131)
       R4: 1.3481 -> y = 238.2 (x=181)
       R7: 1.1516 -> y = 261.8 (x=257)
       R10: 1.0486 -> y = 274.2 (x=333)
       R15: 0.9132 -> y = 290.4 (x=460)
       R20: 0.8557 -> y = 297.3 (x=587)
       R25: 0.8162 -> y = 302.1 (x=713)
       R27: 0.7475 -> y = 310.3 (x=764)
       R30: 0.8123 -> y = 302.5 (x=840)
  -->
  <path d="M 80 120 L 105 138 L 131 190 L 181 238 L 257 262 L 333 274 L 460 290 L 587 297 L 713 302 L 764 310 L 840 303 L 840 400 L 80 400 Z" fill="url(#loss-area)" />
  <path d="M 80 120 L 105 138 L 131 190 L 181 238 L 257 262 L 333 274 L 460 290 L 587 297 L 713 302 L 764 310 L 840 303" fill="none" stroke="#a78bfa" stroke-width="3" />

  <!-- Best Loss Marker (Round 27: 0.7475) -->
  <circle cx="764" cy="310" r="5" fill="#a78bfa" stroke="#ffffff" stroke-width="2" />
  <rect x="705" y="325" width="118" height="24" rx="4" fill="#6d28d9" />
  <text x="764" y="341" class="tick-label" fill="#ffffff" font-weight="700">Min Loss: 0.748</text>

  <!-- Legend -->
  <g transform="translate(560, 60)">
    <rect width="280" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    
    <line x1="20" y1="24" x2="45" y2="24" stroke="#a78bfa" stroke-width="3" />
    <circle cx="32" cy="24" r="3.5" fill="#a78bfa" />
    <text x="55" y="28" class="legend-text">GradFed (Smooth Quality Descent)</text>

    <line x1="20" y1="44" x2="45" y2="44" stroke="#10b981" stroke-width="2.5" />
    <circle cx="32" cy="44" r="3" fill="#10b981" />
    <text x="55" y="48" class="legend-text">FedPPO (Zhao et al., 2025)</text>

    <line x1="20" y1="64" x2="45" y2="64" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" />
    <text x="55" y="68" class="legend-text">FedProx (Li et al., 2020)</text>

    <line x1="20" y1="84" x2="45" y2="84" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3" />
    <text x="55" y="88" class="legend-text">FedAvg (McMahan et al., 2017)</text>
  </g>
</svg>

       28: 73.78 (x=789, y=186.5)
       29: 73.40 (x=815, y=187.8)
       30: 73.18 (x=840, y=188.5)
  -->
  <path d="M 80 397 L 105 375 L 131 319 L 156 296 L 181 265 L 207 284 L 232 272 L 257 244 L 283 228 L 308 228 L 333 228 L 359 217 L 384 216 L 409 216 L 435 207 L 460 207 L 485 202 L 511 203 L 536 199 L 561 198 L 587 199 L 612 195 L 637 193 L 663 194 L 688 191 L 713 190 L 739 193 L 764 184 L 789 186 L 815 188 L 840 188 L 840 430 L 80 430 Z" fill="url(#gradfed-area)" />
  
  <path d="M 80 397 L 105 375 L 131 319 L 156 296 L 181 265 L 207 284 L 232 272 L 257 244 L 283 228 L 308 228 L 333 228 L 359 217 L 384 216 L 409 216 L 435 207 L 460 207 L 485 202 L 511 203 L 536 199 L 561 198 L 587 199 L 612 195 L 637 193 L 663 194 L 688 191 L 713 190 L 739 193 L 764 184 L 789 186 L 815 188 L 840 188" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Target Marker on Peak (Round 27: 74.42%) -->
  <circle cx="764" cy="184" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <rect x="705" y="152" width="118" height="24" rx="4" fill="#0284c7" />
  <text x="764" y="168" class="badge" fill="#ffffff">Peak: 74.42% (R27)</text>

  <!-- Legend Box -->
  <g transform="translate(560, 60)">
    <rect width="280" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    
    <line x1="20" y1="24" x2="45" y2="24" stroke="#38bdf8" stroke-width="3" />
    <circle cx="32" cy="24" r="3.5" fill="#38bdf8" />
    <text x="55" y="28" class="legend-text">GradFed (Proposed Quality-Aware)</text>

    <line x1="20" y1="44" x2="45" y2="44" stroke="#10b981" stroke-width="2.5" />
    <circle cx="32" cy="44" r="3" fill="#10b981" />
    <text x="55" y="48" class="legend-text">FedPPO (Zhao et al., 2025)</text>

    <line x1="20" y1="64" x2="45" y2="64" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" />
    <text x="55" y="68" class="legend-text">FedProx (Li et al., 2020)</text>

    <line x1="20" y1="84" x2="45" y2="84" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3" />
    <text x="55" y="88" class="legend-text">FedAvg (McMahan et al., 2017)</text>
  </g>
</svg>

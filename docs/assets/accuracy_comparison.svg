<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="chart-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gradfed-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .tick-label { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
    .tick-label-y { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; text-anchor: end; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" rx="14" fill="url(#chart-bg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="42" class="title">Test Accuracy vs. Communication Rounds (CIFAR-10)</text>
  <text x="50" y="62" class="subtitle">Non-IID Dirichlet Partition (α = 10.0, 50 Clients, 20% Participation Rate, ResNet-10)</text>

  <!-- Chart Dimensions: X: 80 to 840 (width 760), Y: 430 to 100 (height 330) -->
  <!-- X: Round 0 to 30 => x = 80 + round * (760/30) = 80 + round * 25.33 -->
  <!-- Y: 0% to 100% => y = 430 - acc * (330/100) = 430 - acc * 3.3 -->

  <!-- Grid lines (Horizontal: 0%, 20%, 40%, 60%, 80%, 100%) -->
  <g stroke="#334155" stroke-dasharray="4,4" stroke-width="0.8">
    <line x1="80" y1="430" x2="840" y2="430" stroke="#475569" stroke-width="1.2" stroke-dasharray="none" />
    <line x1="80" y1="364" x2="840" y2="364" />
    <line x1="80" y1="298" x2="840" y2="298" />
    <line x1="80" y1="232" x2="840" y2="232" />
    <line x1="80" y1="166" x2="840" y2="166" />
    <line x1="80" y1="100" x2="840" y2="100" />
  </g>

  <!-- Y-Axis Ticks -->
  <text x="70" y="434" class="tick-label-y">0%</text>
  <text x="70" y="368" class="tick-label-y">20%</text>
  <text x="70" y="302" class="tick-label-y">40%</text>
  <text x="70" y="236" class="tick-label-y">60%</text>
  <text x="70" y="170" class="tick-label-y">80%</text>
  <text x="70" y="104" class="tick-label-y">100%</text>

  <!-- X-Axis Ticks (Rounds 0, 5, 10, 15, 20, 25, 30) -->
  <g class="tick-label">
    <text x="80" y="452">0</text>
    <text x="207" y="452">5</text>
    <text x="333" y="452">10</text>
    <text x="460" y="452">15</text>
    <text x="587" y="452">20</text>
    <text x="713" y="452">25</text>
    <text x="840" y="452">30</text>
  </g>

  <!-- Axis Labels -->
  <text x="460" y="485" class="axis-label" text-anchor="middle">Communication Rounds (t)</text>
  <text x="28" y="265" class="axis-label" transform="rotate(-90 28 265)" text-anchor="middle">Top-1 Test Accuracy (%)</text>

  <!-- Curve 1: FedAvg (Red/Orange dashed) -->
  <!-- 0:10, 5:32.1, 10:44.6, 15:52.3, 20:57.1, 25:60.4, 30:62.3 -->
  <path d="M 80 397 Q 207 324, 333 283 T 587 241 T 840 224" fill="none" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="5,4" />

  <!-- Curve 2: FedProx (Amber dashed) -->
  <!-- 0:10, 5:38.2, 10:51.4, 15:58.7, 20:63.2, 25:66.5, 30:67.8 -->
  <path d="M 80 397 Q 207 304, 333 260 T 587 221 T 840 206" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="5,4" />

  <!-- Curve 3: FedPPO (Green line) -->
  <!-- 0:10, 1:15.8, 2:28.8, 3:43.3, 5:54.5, 10:69.9, 15:74.6, 20:78.3, 25:78.1, 30:81.7 -->
  <path d="M 80 397 L 105 378 L 131 335 L 156 287 L 207 250 L 333 199 L 460 184 L 587 171 L 713 172 L 840 160" fill="none" stroke="#10b981" stroke-width="2.5" />

  <!-- Curve 4: GradFed (Cyan Glow Line with Shaded Area) -->
  <!-- Actual data points:
       0: 10.0 (y=397)
       1: 16.78 (x=105, y=374.6)
       2: 33.53 (x=131, y=319.3)
       3: 40.54 (x=156, y=296.2)
       4: 50.04 (x=181, y=264.8)
       5: 44.15 (x=207, y=284.3)
       6: 47.95 (x=232, y=271.8)
       7: 56.25 (x=257, y=244.4)
       8: 61.09 (x=283, y=228.4)
       9: 61.23 (x=308, y=227.9)
       10: 61.05 (x=333, y=228.5)
       11: 64.60 (x=359, y=216.8)
       12: 64.72 (x=384, y=216.4)
       13: 64.74 (x=409, y=216.3)
       14: 67.47 (x=435, y=207.3)
       15: 67.53 (x=460, y=207.1)
       16: 68.95 (x=485, y=202.5)
       17: 68.82 (x=511, y=202.9)
       18: 69.94 (x=536, y=199.2)
       19: 70.43 (x=561, y=197.6)
       20: 70.07 (x=587, y=198.8)
       21: 71.27 (x=612, y=194.8)
       22: 71.67 (x=637, y=193.5)
       23: 71.48 (x=663, y=194.1)
       24: 72.32 (x=688, y=191.3)
